<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#gridPattern)" />

  <!-- Radial Glow Behind Logo -->
  <circle cx="240" cy="200" r="140" fill="#6366F1" opacity="0.12" filter="url(#glow)" />
  <circle cx="950" cy="180" r="220" fill="#06B6D4" opacity="0.06" filter="url(#glow)" />

  <!-- Logo Mark (Linear / Raycast Precision Bolt) -->
  <g transform="translate(180, 120)">
    <!-- Rounded Outer Shield -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <rect x="4" y="4" width="92" height="92" rx="20" fill="#0B0F19" />
    
    <!-- Bolt Symbol -->
    <path d="M 56 18 L 32 54 L 50 54 L 44 82 L 68 46 L 50 46 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  </g>

  <!-- Title & Typography -->
  <text x="310" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">
    VELOCE <tspan fill="url(#accentGrad)">ATS</tspan>
  </text>

  <!-- Subtitle / Value Prop -->
  <text x="312" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="500" letter-spacing="-0.2" fill="#94A3B8">
    Enterprise Applicant Tracking System built for hyper-velocity hiring teams.
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(312, 255)">
    <!-- Badge 1: Linear Speed -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#10B981" />
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Linear Speed</text>

    <!-- Badge 2: Raycast Keyboard -->
    <rect x="142" y="0" width="144" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="156" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC">⌘K Command Bar</text>

    <!-- Badge 3: ACID Transactions -->
    <rect x="298" y="0" width="146" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="312" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">ACID Transitions</text>

    <!-- Badge 4: Dual DB -->
    <rect x="456" y="0" width="158" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="470" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">PostgreSQL &amp; SQLite</text>
  </g>
</svg>
