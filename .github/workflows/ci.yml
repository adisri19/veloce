name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate SQLite schema and Prisma client
        run: |
          npx tsx scripts/make-sqlite-schema.ts
          npx prisma generate --schema prisma/schema.sqlite.prisma
          DATABASE_URL="file:./dev.db" npx prisma db push --schema prisma/schema.sqlite.prisma
          DATABASE_URL="file:./dev.db" npx tsx prisma/seed.ts

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run Vitest test suite
        run: npm test

      - name: Run Endpoint Verification Harness
        run: DATABASE_URL="file:./dev.db" npx tsx scripts/verify-endpoints.ts

      - name: Build Next.js production bundle
        run: DATABASE_URL="file:./dev.db" npm run build
